name: ${STACK_NAME:-dossier}

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-healthcheck: &default-healthcheck
  interval: 30s
  retries: 3
  timeout: 5s

x-base: &base
  profiles:
    - ${SERVICE_PROFILE:-app}
  logging: *default-logging
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
  networks:
    - proxy
    - database
  healthcheck: *default-healthcheck

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  database:
    name: ${DATABASE_NETWORK:-database}
    external: true

services:
  dossier:
    <<: *base
    image: ${DOSSIER_IMAGE:-dossier:akrista}
    build:
      context: .
      target: production
    container_name: dossier
    env_file: .env
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://${USER}:${PASSWORD}@${DB_HOST:-postgis}:${PORT:-5432}/${DB_NAME:-dossier}
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD}
      DOSSIER_SECRET: ${DOSSIER_SECRET}
      TZ: ${TZ:-America/Caracas}
      DOSSIER_PUBLIC_URL: ${DOSSIER_PUBLIC_URL:-}
      DOSSIER_TELEMETRY: ${DOSSIER_TELEMETRY:-off}
    volumes:
      - ${DATA_DIR:-./data}:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
